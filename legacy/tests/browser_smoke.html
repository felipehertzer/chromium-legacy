<!doctype html>
<meta charset="utf-8">
<title>Chromium Legacy browser checks</title>
<style>#layout { width:123.5px; height:31px; background:rgb(18,52,86); }</style>
<h1>Chromium Legacy browser checks</h1>
<div id="layout"></div><pre id="results">Running…</pre>
<script>
(async () => {
  const results = [];
  const check = async (name, fn) => {
    try { results.push({name, passed:!!(await fn())}); }
    catch (error) { results.push({name, passed:false, error:String(error)}); }
  };
  await check('BigInt', () => ((2n ** 64n) + 1n).toString() === '18446744073709551617');
  await check('WebAssembly', async () => {
    const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
    const {instance} = await WebAssembly.instantiate(bytes);
    return instance.exports.add(19,23) === 42;
  });
  await check('WebCrypto SHA-256', async () => {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('abc'));
    return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2,'0')).join('') === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';
  });
  await check('Worker', () => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob(['postMessage(21*2)'], {type:'text/javascript'}));
    const worker = new Worker(url);
    const done = fn => { clearTimeout(timer); worker.terminate(); URL.revokeObjectURL(url); fn(); };
    const timer = setTimeout(() => done(() => reject(Error('worker timed out'))),5000);
    worker.onmessage = event => done(() => resolve(event.data === 42));
    worker.onerror = () => done(() => reject(Error('worker failed')));
  }));
  await check('Canvas 2D pixels', () => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 2;
    const context = canvas.getContext('2d');
    context.fillStyle = '#123456'; context.fillRect(0,0,2,2);
    return [...context.getImageData(0,0,1,1).data].join(',') === '18,52,86,255';
  });
  await check('WebGL pixels', () => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 2;
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!gl) throw Error('no WebGL context');
    gl.clearColor(0.25,0.5,0.75,1); gl.clear(gl.COLOR_BUFFER_BIT);
    const pixels = new Uint8Array(4); gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    return [...pixels].every((n,i) => Math.abs(n - [64,128,191,255][i]) <= 1) && gl.getError() === gl.NO_ERROR;
  });
  await check('CSS layout', () => {
    const bounds = document.getElementById('layout').getBoundingClientRect();
    return bounds.width === 123.5 && bounds.height === 31;
  });
  window.smokeResults = results;
  document.getElementById('results').textContent = JSON.stringify(results,null,2);
})();
</script>
